name: "Import Expression Data"
description: "Full import flow: file > metadata > platform > log transform"

setup:
  stub_files:
    - source: "testdata/sample_expression.txt"
      as: "/tmp/bmdexpress-test/sample_expression.txt"

steps:
  - action: stub_file_chooser
    files: ["/tmp/bmdexpress-test/sample_expression.txt"]
    description: "Pre-load file chooser to return test file"

  - action: click_menu
    path: ["File", "Import", "Expression Data"]
    description: "File > Import > Expression Data"

  - action: wait
    millis: 2000
    description: "Wait for file parsing"

  - action: click_dialog_button
    text: "OK"
    description: "Accept platform selection"

  - action: wait_for
    target: ".dialog-pane"
    timeout_millis: 3000
    description: "Wait for log transform dialog"

  - action: click_dialog_button
    text: "OK"
    description: "Accept BASE2 log transformation"

  - action: wait
    millis: 1500
    description: "Wait for experiment to load"

  - action: clear_file_chooser_stub
    description: "Clean up file chooser stub"
